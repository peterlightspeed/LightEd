[project]
name = "lighted-ai"
version = "0.1.0"
description = "AI/ML module for LightEd: tutor, RAG, recommendations, analytics."
requires-python = ">=3.11"

[project.optional-dependencies]
local-embeddings = ["sentence-transformers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires network access and a configured Gemini API key",
]
