name: AI CI

on:
  push:
    branches: [main, develop]
    paths: ["ai/**", ".github/workflows/ai-ci.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["ai/**"]

defaults:
  run:
    working-directory: ai

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
