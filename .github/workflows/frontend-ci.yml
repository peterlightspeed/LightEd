name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths: ["apps/web/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["apps/web/**"]

defaults:
  run:
    working-directory: apps/web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
