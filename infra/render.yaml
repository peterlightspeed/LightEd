# Render blueprint — deploys the FastAPI backend + managed Postgres.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: lighted-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lighted-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false

databases:
  - name: lighted-db
    databaseName: lighted
    plan: free
